[package]
name = "kairo-desktop"
version = "0.1.0"
description = "Kairo Autonomous Cybersecurity Agent - Cross-Platform Desktop Shell"
authors = ["Kairo Core Team"]
edition = "2021"

[lib]
name = "kairo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
